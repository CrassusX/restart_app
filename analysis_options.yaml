include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - test_apps/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_use_package_imports
    - avoid_dynamic_calls
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - prefer_single_quotes
    - sort_pub_dependencies
    - unawaited_futures
